name: Diagnose Hostinger App

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install hostinger-api-mcp
        run: npm install -g hostinger-api-mcp@0.2.12

      - name: Run diagnostics
        env:
          APITOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node .github/scripts/hostinger-diagnose.js
