name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/ecom-shopify-social-ai-agent-M75vk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install hostinger-api-mcp
        run: npm install -g hostinger-api-mcp@0.2.12

      - name: Write .env.local from secrets
        run: |
          cat > .env.local <<ENVEOF
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          SHOPIFY_STORE_DOMAIN="${{ secrets.SHOPIFY_STORE_DOMAIN }}"
          SHOPIFY_ADMIN_API_ACCESS_TOKEN="${{ secrets.SHOPIFY_ADMIN_API_ACCESS_TOKEN }}"
          SHOPIFY_ADMIN_API_VERSION="2024-10"
          SHOPIFY_WEBHOOK_SECRET="${{ secrets.SHOPIFY_WEBHOOK_SECRET }}"
          SHOPIFY_CLIENT_ID="${{ secrets.SHOPIFY_CLIENT_ID }}"
          SHOPIFY_CLIENT_SECRET="${{ secrets.SHOPIFY_CLIENT_SECRET }}"
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN="${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}"
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN="${{ secrets.SHOPIFY_STORE_DOMAIN }}"
          META_APP_ID="${{ secrets.META_APP_ID }}"
          META_APP_SECRET="${{ secrets.META_APP_SECRET }}"
          META_PAGE_ACCESS_TOKEN="${{ secrets.META_PAGE_ACCESS_TOKEN }}"
          META_INSTAGRAM_BUSINESS_ACCOUNT_ID="${{ secrets.META_INSTAGRAM_BUSINESS_ACCOUNT_ID }}"
          META_WEBHOOK_VERIFY_TOKEN="${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}"
          META_FACEBOOK_PAGE_ID="${{ secrets.META_FACEBOOK_PAGE_ID }}"
          META_WHATSAPP_PHONE_NUMBER_ID="${{ secrets.META_WHATSAPP_PHONE_NUMBER_ID }}"
          META_AD_ACCOUNT_ID="${{ secrets.META_AD_ACCOUNT_ID }}"
          META_USER_ACCESS_TOKEN="${{ secrets.META_USER_ACCESS_TOKEN }}"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}"
          VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}"
          VAPID_SUBJECT="mailto:support@rbjewelry.co"
          ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD || 'RBJewelry2025!' }}"
          ENVEOF

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema changes
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed inventory from paid orders (one-time, skips if already done)
        run: node scripts/rebuild-inventory.mjs
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_ACCESS_TOKEN }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Create archive with pre-built app
        run: |
          tar -czf /tmp/rbjewelry-deploy.tar.gz \
            .next src public prisma scripts package.json package-lock.json \
            next.config.mjs tailwind.config.ts tsconfig.json \
            postcss.config.mjs start.js .env.local
          ls -lh /tmp/rbjewelry-deploy.tar.gz

      - name: Deploy to Hostinger
        env:
          APITOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node .github/scripts/hostinger-deploy.js
